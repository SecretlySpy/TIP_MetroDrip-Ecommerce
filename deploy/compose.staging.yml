name: metrodrip-staging

# Bound local JSON logs so access traffic cannot fill a bootstrap-sized SSD.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # MySQL 8.4 is the supported LTS line and is pinned to avoid surprise major
    # upgrades. Its port is never published to the host or public network.
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-storage-engine=InnoDB
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy/.env.staging}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in deploy/.env.staging}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env.staging}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env.staging}"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}"
          mysqladmin ping -h 127.0.0.1 --user=root --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    # Only this service is built from the repository. It remains private and is
    # reachable publicly only through the Caddy reverse proxy.
    image: metrodrip-staging:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/.env.staging}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in deploy/.env.staging}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in deploy/.env.staging}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy/.env.staging}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in deploy/.env.staging}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env.staging}"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      STAGING_HOST: "${STAGING_HOST:?Set STAGING_HOST in deploy/.env.staging}"
      STAGING_SEED_DEMO: "${STAGING_SEED_DEMO:-0}"
      STAGING_SEED_PREVIEW_ENABLED: "${STAGING_SEED_PREVIEW_ENABLED:-0}"
      STAGING_ALLOW_INSECURE_HTTP: "${STAGING_ALLOW_INSECURE_HTTP:-0}"
      # Strangler seams. Defaults keep every provider in-process; an operator
      # opts a seam over to its sidecar by setting the matching provider key.
      # prod.py refuses to boot an `http` provider whose token is unset
      # (ADR-P3-008), so a half-configured cutover fails at startup rather than
      # silently sending unauthenticated traffic.
      NOTIFICATION_PROVIDER: "${NOTIFICATION_PROVIDER:-email_sms}"
      NOTIFICATION_SERVICE_URL: http://notifications:8002
      NOTIFICATION_SERVICE_TOKEN: "${NOTIFICATION_SERVICE_TOKEN:?Set NOTIFICATION_SERVICE_TOKEN in deploy/.env.staging}"
      SHIPPING_PROVIDER: "${SHIPPING_PROVIDER:-jnt}"
      SHIPPING_SERVICE_URL: http://fulfillment:8003
      SHIPPING_SERVICE_TOKEN: "${SHIPPING_SERVICE_TOKEN:?Set SHIPPING_SERVICE_TOKEN in deploy/.env.staging}"
      INVENTORY_PROVIDER: "${INVENTORY_PROVIDER:-local}"
      INVENTORY_SERVICE_URL: http://inventory:8001
      INVENTORY_SERVICE_TOKEN: "${INVENTORY_SERVICE_TOKEN:?Set INVENTORY_SERVICE_TOKEN in deploy/.env.staging}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - edge
      - database
    healthcheck:
      # The direct probe supplies the same host/proxy headers Caddy sends. This
      # exercises Django host validation, HTTPS awareness, and database readiness.
      test:
        - CMD-SHELL
        - >-
          python -c "import http.client;
          connection = http.client.HTTPConnection('127.0.0.1', 8000, timeout=5);
          connection.request('GET', '/healthz/ready/', headers={'Host': '$${STAGING_HOST}', 'X-Forwarded-Proto': 'https'});
          response = connection.getresponse();
          raise SystemExit(0 if response.status == 200 else 1)"
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 45s
    stop_grace_period: 30s

  scheduler:
    # Exactly ONE scheduler process per environment (ADR-A-014/ADR-B-003): it
    # runs the reservation TTL sweep and the low-stock scan. It reuses the app
    # image but bypasses the entrypoint — the app container alone owns
    # collectstatic/migrate/seed, so the scheduler can never race a migration.
    image: metrodrip-staging:local
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: []
    command: ["python", "manage.py", "run_scheduler"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/.env.staging}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in deploy/.env.staging}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in deploy/.env.staging}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy/.env.staging}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in deploy/.env.staging}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env.staging}"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      NOTIFICATION_PROVIDER: "${NOTIFICATION_PROVIDER:-email_sms}"
      NOTIFICATION_SERVICE_URL: http://notifications:8002
      NOTIFICATION_SERVICE_TOKEN: "${NOTIFICATION_SERVICE_TOKEN:?Set NOTIFICATION_SERVICE_TOKEN in deploy/.env.staging}"
      INVENTORY_PROVIDER: "${INVENTORY_PROVIDER:-local}"
      INVENTORY_SERVICE_URL: http://inventory:8001
      INVENTORY_SERVICE_TOKEN: "${INVENTORY_SERVICE_TOKEN:?Set INVENTORY_SERVICE_TOKEN in deploy/.env.staging}"
      STAGING_HOST: "${STAGING_HOST:?Set STAGING_HOST in deploy/.env.staging}"
    depends_on:
      # Waiting on the healthy app guarantees migrations have already applied.
      app:
        condition: service_healthy
    networks:
      - database
    stop_grace_period: 30s

  caddy:
    # Caddy obtains and renews public TLS certificates automatically once DNS
    # points at this host and inbound TCP ports 80/443 are reachable.
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      STAGING_HOST: "${STAGING_HOST:?Set STAGING_HOST in deploy/.env.staging}"
      CADDY_EMAIL: "${CADDY_EMAIL:?Set CADDY_EMAIL in deploy/.env.staging}"
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
      - "${STAGING_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge

  # --- Strangler sidecars (ADR-P3-006) -------------------------------------
  #
  # Behind the `services` profile, so a default `docker compose up` still brings
  # up exactly db + app + scheduler + caddy. That matches the provider defaults
  # — every seam is in-process unless an operator opts it out — and it keeps the
  # single-host cost envelope (NFR-5) rather than running three idle containers
  # that nothing calls.
  #
  #     docker compose --profile services up -d --build
  #
  # They were previously absent from staging entirely, which meant the remote
  # provider keys could be selected with nothing behind them. They stay on the
  # internal network only: `deploy/Caddyfile` reverse-proxies the Django app and
  # nothing else, so none is reachable from the public hostname.
  #
  # Each refuses every request and reports NOT ready without its token
  # (ADR-P3-009), so a missing secret fails closed and visibly rather than
  # silently serving unauthenticated traffic.

  notifications:
    profiles: ["services"]
    image: metrodrip-services:staging
    build:
      context: ..
      dockerfile: docker/Dockerfile.services
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      ["uvicorn", "services.notifications.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      LOG_LEVEL: INFO
      NOTIFICATION_SERVICE_TOKEN: "${NOTIFICATION_SERVICE_TOKEN:?Set NOTIFICATION_SERVICE_TOKEN in deploy/.env.staging}"
      PUSH_PROVIDER: "${PUSH_PROVIDER:-simulated}"
    expose:
      - "8002"
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8002/healthz/ready', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s
    stop_grace_period: 15s

  fulfillment:
    profiles: ["services"]
    image: metrodrip-services:staging
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      ["uvicorn", "services.fulfillment.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      LOG_LEVEL: INFO
      SHIPPING_SERVICE_TOKEN: "${SHIPPING_SERVICE_TOKEN:?Set SHIPPING_SERVICE_TOKEN in deploy/.env.staging}"
    expose:
      - "8003"
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8003/healthz/ready', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s
    stop_grace_period: 15s

  inventory:
    profiles: ["services"]
    image: metrodrip-services:staging
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      ["uvicorn", "services.inventory.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      LOG_LEVEL: INFO
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in deploy/.env.staging}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env.staging}"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      # Shared schema, exclusive writer (ADR-P3-013): the ledger maps Django's
      # tables and is their only writer. Django owns the DDL, so create_all is
      # skipped and migrations remain the single schema authority.
      MYSQL_DATABASE_INVENTORY: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy/.env.staging}"
      SKIP_CREATE_ALL: "1"
      INVENTORY_SERVICE_TOKEN: "${INVENTORY_SERVICE_TOKEN:?Set INVENTORY_SERVICE_TOKEN in deploy/.env.staging}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"
    networks:
      - database
    healthcheck:
      # Readiness here also proves the token is set and the schema is reachable
      # — it returns 503 otherwise, so a misconfigured ledger never goes live.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/healthz/ready', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    stop_grace_period: 15s


volumes:
  # Named volumes survive container replacement and ordinary Compose restarts.
  dbdata:
  caddy_data:
  caddy_config:

networks:
  # The edge network gives Caddy outbound access for ACME certificate issuance.
  edge:
  # Only Django and MySQL join this internal network; it has no public route.
  database:
    internal: true
