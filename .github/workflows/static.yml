name: Deploy MetroDrip guide to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - docs/images/**
      - scripts/build-pages-site.py
      - .github/workflows/static.yml
  workflow_dispatch:

# Pages is configured with “GitHub Actions” as its source. Build and deployment
# permissions are scoped separately so the artifact-producing job cannot deploy.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the guide source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and validate the public guide artifact
        run: python scripts/build-pages-site.py --output .pages-site
      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
