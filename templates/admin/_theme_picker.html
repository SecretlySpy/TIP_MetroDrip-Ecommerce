<div class="console-theme-picker" role="group" aria-label="Colour theme">
  <span class="console-theme-picker__label">Theme</span>
  <div class="console-theme-picker__options">
    <button type="button"
            class="console-theme-picker__option"
            data-console-theme="light"
            aria-pressed="false">
      <span aria-hidden="true">&#9788;</span> Light
    </button>
    <button type="button"
            class="console-theme-picker__option"
            data-console-theme="dark"
            aria-pressed="false">
      <span aria-hidden="true">&#9790;</span> Dark
    </button>
  </div>
</div>
