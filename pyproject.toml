[tool.ruff]
line-length = 100
# py313 (not py314): ruff's py314 formatter applies PEP 758 and rewrites
# `except (A, B):` → `except A, B:`, which is a SyntaxError on every Python
# before 3.14 and violates the project rule (NFR-01 / test_source_compiles).
# Parenthesized form is valid on 3.12–3.14; keep it.
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, DJ flake8-django
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# One-off root-level seed scripts call django.setup() before their imports and
# hold long content strings; they are dev utilities, not shipped code.
"seed_*.py" = ["E402", "E501"]
# AppConfig.ready() imports provider modules purely for their registration
# side effects. `--fix` deleted these once and silently broke every provider
# lookup at runtime; the ignore makes that impossible to repeat.
"apps/*/apps.py" = ["F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra"
